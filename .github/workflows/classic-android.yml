name: FlClash Classic Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flclash-classic-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and signing verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: '3.47.6'
      GO_VERSION: '1.27.1'
      NDK_VERSION: r28c
    steps:
      - name: Checkout FlClash and mihomo sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format and analyze Dart sources
        run: |
          dart format lib test tool plugins setup.dart
          flutter analyze --no-fatal-infos

      - name: Configure repository-local release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -n "${!var}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" == 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FlClash repository signing Secrets are not configured; building a DEBUG APK (.dev), NOT a NetToggle-signed release."
            exit 0
          fi
          if [[ "$configured" != 4 ]]; then
            echo "::error::Release signing needs all four FlClash repository Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | sed '/---/d' | tr -d '\r\n ' | base64 --decode > android/app/keystore.jks
          test -s android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned CA certificate bundle
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          set -euo pipefail
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build release APKs with repository signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable -v

      - name: Build development APK without release signing
        if: steps.signing.outputs.enabled != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --debug

      - name: Verify signed release APKs
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mapfile -d '' apks < <(find dist -type f -name '*.apk' -print0)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            package="$("$build_tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            test "$package" = 'com.follow.clash' || {
              echo "::error::Unexpected signed APK package: $package"
              exit 1
            }
            sha256sum "$apk"
          done

      - name: Upload signed release APKs
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Classic-signed-release
          path: dist/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload development APK (different signing certificate)
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Classic-DEBUG-not-release-signed
          path: build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Delete signing files
        if: always()
        shell: bash
        run: rm -f android/app/keystore.jks android/local.properties
